<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6a47">
<title>Ostunimekiri {{NADAL}} · SoodneKorv</title>
<style>
  /* Kujundus on failis sees, et fail töötaks ka ilma internetita. */
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f7f2; color: #1d3025; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  .leht { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .brand svg { width: 28px; height: 28px; }
  .brand span { color: #2f6a47; }
  h1 { margin: 18px 0 4px; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; }
  .meta { margin: 0; color: #637368; font-size: 15px; }
  .kokku { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border-radius: 18px; background: #2f6a47; color: #fff; }
  .kokku small { display: block; opacity: .8; font-size: 13px; }
  .kokku b { font-size: 17px; }
  .kokku .summa { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
  /* Alumine riba: loendur, edenemisriba ja "Peida ostetud". Töötab ainult CSS-iga (ka ilma JavaScriptita). */
  .leht { counter-reset: ostetud; padding-bottom: 120px; }
  .linnuke, .peida-lyliti { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .linnuke:checked { counter-increment: ostetud; }
  .riba { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; background: #fff; border-top: 1px solid #e0e9df; box-shadow: 0 -6px 20px rgba(28, 63, 43, .08); padding: 12px 16px 22px; }
  .riba-sisu { max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .edenemine { flex: 1; min-width: 0; }
  .edenemine p { margin: 0 0 6px; font-size: 14px; color: #637368; }
  #loendur::before { content: counter(ostetud); color: #1d3025; font-weight: 700; }
  .joon { display: flex; height: 8px; border-radius: 99px; background: #e0e9df; overflow: hidden; }
  .joon i { flex: 1; }
  .nupp { flex: none; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid #d3dfd2; border-radius: 99px; background: #fff; color: #1d3025; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .peida-lyliti:checked ~ .riba .nupp { background: #1d3025; border-color: #1d3025; color: #fff; }
  .peida-lyliti:focus-visible ~ .riba .nupp { outline: 3px solid #c6e27a; }
  .nupp .kui-peidus, .peida-lyliti:checked ~ .riba .nupp .kui-naha { display: none; }
  .peida-lyliti:checked ~ .riba .nupp .kui-peidus { display: inline; }
  .pood { margin-top: 18px; background: #fff; border: 1px solid #e0e9df; border-radius: 18px; overflow: hidden; }
  .pood h2 { margin: 0; padding: 14px 18px; display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; border-bottom: 1px solid #e0e9df; }
  .poe-summa { font-size: 15px; color: #637368; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  .pood li + li { border-top: 1px solid #eef3ed; }
  .rida { display: flex; align-items: center; gap: 14px; padding: 14px 18px; min-height: 64px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .kast { flex: none; width: 26px; height: 26px; border: 2px solid #b9c9b8; border-radius: 8px; display: grid; place-items: center; transition: background .15s, border-color .15s; }
  .kast::after { content: ""; width: 7px; height: 13px; border: solid #fff; border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); opacity: 0; }
  .tekst { flex: 1; min-width: 0; }
  .tekst b, .paremal b { display: block; font-size: 16px; }
  .tekst small, .paremal small { display: block; color: #637368; font-size: 13px; }
  .tekst small { overflow-wrap: anywhere; }
  .paremal { flex: none; text-align: right; }
  .puudu { margin: 18px 0 0; padding: 14px 16px; border-radius: 14px; background: #fff7e6; border: 1px solid #f1dfb4; font-size: 14px; }
  .menuu { margin-top: 18px; background: #fff; border: 1px solid #e0e9df; border-radius: 18px; }
  .menuu summary { padding: 16px 18px; font-weight: 700; cursor: pointer; }
  .menuu ul { padding: 0 18px 14px; }
  .menuu li { padding: 6px 0; font-size: 15px; }
  .menuu li span { display: inline-block; min-width: 120px; color: #637368; font-size: 13px; }
  .menuu li.paev { padding-top: 12px; font-weight: 700; }
  .valmis { display: none; margin-top: 18px; padding: 16px; border-radius: 14px; background: #eaf2e9; text-align: center; font-weight: 600; }
  footer { margin-top: 22px; color: #637368; font-size: 13px; text-align: center; }
  footer .tyhjenda { margin-top: 10px; background: none; border: 0; color: #2f6a47; font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
{{STIILID}}
  @media print { .riba, footer .tyhjenda { display: none; } .leht { padding-bottom: 0; } .pood, .menuu { break-inside: avoid; } }
</style>
</head>
<body>
<main>
<form class="leht" id="leht">
  {{LINNUKESED}}
  <input class="peida-lyliti" type="checkbox" id="peida">
  <div class="brand">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#2f6a47"/><path d="M10 21h28l-3.1 14.2A3.5 3.5 0 0 1 31.5 38h-15a3.5 3.5 0 0 1-3.4-2.8L10 21z" fill="#fff"/><path d="M17 21l6-10M31 21l-6-10" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><path d="M19 26.5v6M24 26.5v6M29 26.5v6" stroke="#2f6a47" stroke-width="2.6" stroke-linecap="round"/><circle cx="37" cy="12" r="6.5" fill="#c6e27a"/><path d="M34.3 12.3l1.9 1.9 3.6-3.8" fill="none" stroke="#2f6a47" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <strong>Soodne<span>Korv</span></strong>
  </div>

  <h1>Ostunimekiri</h1>
  <p class="meta">{{NADAL}} · {{PORTSJONID}} portsjonit toidukorra kohta</p>

  <div class="kokku">
    <div><small>Mine poodi</small><b>{{POED}}</b></div>
    <div class="summa">{{KOKKU}}</div>
  </div>

  <div id="nimekiri">{{POODIDE_NIMEKIRI}}</div>
  <p class="valmis">Kõik ostetud! Head söögiisu.</p>
  {{PUUDU}}
  {{MENUU}}

  <footer>
    Hinnad seisuga {{SEISUGA}}. Poes võivad hinnad erineda.<br>
    <button class="tyhjenda" type="reset">Eemalda kõik linnukesed</button>
  </footer>

  <div class="riba">
    <div class="riba-sisu">
      <div class="edenemine">
        <p><span id="loendur"></span> / {{RIDU}} ostetud</p>
        <div class="joon">{{TUKID}}</div>
      </div>
      <label class="nupp" for="peida"><span class="kui-naha">Peida ostetud</span><span class="kui-peidus">Näita kõiki</span></label>
    </div>
  </div>
</form>
</main>
<script>
  // Kõik nähtav (loendur, riba, peitmine) töötab ilma JavaScriptita.
  // JavaScript ainult jätab linnukesed meelde, kui fail avatakse brauseris (failieelvaates seda ei käivitata).
  var VOTI = '{{VOTI}}';
  var vorm = document.getElementById('leht');
  var kastid = document.querySelectorAll('.linnuke');
  function salvesta() {
    var margitud = [];
    for (var i = 0; i < kastid.length; i++) if (kastid[i].checked) margitud.push(kastid[i].id);
    try { localStorage.setItem(VOTI, JSON.stringify(margitud)); } catch (viga) { /* ilma salvestamiseta töötab ikka */ }
  }
  try {
    var salvestatud = JSON.parse(localStorage.getItem(VOTI)) || [];
    for (var i = 0; i < kastid.length; i++) kastid[i].checked = salvestatud.indexOf(kastid[i].id) !== -1;
  } catch (viga) { /* midagi pole salvestatud */ }
  vorm.addEventListener('change', salvesta);
  vorm.addEventListener('reset', function () { setTimeout(salvesta, 0); });
</script>
</body>
</html>
