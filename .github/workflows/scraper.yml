name: Uuenda toidupoodide hindu

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uuenda-toidupoodide-hindu
  cancel-in-progress: false

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Laadi projekt
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Seadista Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Paigalda vajalikud teegid
        run: python -m pip install requests beautifulsoup4

      - name: Kogu hinnad
        run: |
          python scraperid/rimi.py
          python scraperid/selver.py
          python scraperid/maxima.py

      - name: Kontrolli hinnafaile
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for pood in ("rimi", "selver", "maxima"):
              fail = Path("andmed/hinnad") / f"hinnad_{pood}.json"
              andmed = json.loads(fail.read_text(encoding="utf-8"))
              if not andmed.get("tooted"):
                  raise SystemExit(f"{pood}: ühtegi hinda ei leitud.")
              print(f"{pood}: {len(andmed['tooted'])} hinda")
          PY

      - name: Salvesta uued hinnad
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add andmed/hinnad/hinnad_*.json
          if git diff --cached --quiet; then
            echo "Hinnad ei muutunud."
          else
            git commit -m "Uuenda toidupoodide hindu"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
